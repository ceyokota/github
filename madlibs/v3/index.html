<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <script src="script.js" defer></script>

    <title>Applications V1</title>
</head>
<body>
    <main>
        <section class="computer1">
            <section class="paper">

                <header>
                    <h1>Job Application</h1>
                </header>
                    <section class="timeline">
                        <div class="line"></div>
                        <div class='myinfo1'>
                            <div class="first-dot"></div>
                            <p>My Information</p>
                        </div>
                        <div class="addinfo1">
                            <div class="last-dot"></div>
                            <p>Additional Info</p>
                        </div>
                    </section>
                
                    <article class="form">
                        <h2>My Information</h2>
                            <form id="firstForm">
                                <div>
                                    <label for="name">Full Name</label>
                                    <input type="text" name="name" id="name" required>
                                </div>
                                    
                                <div>
                                    <label for="company">Company</label>
                                    <input type="text" name="company" id="company" required>
                                </div>
                                
                                <div>
                                    <label for="occupation">Childhood Dream Occupation</label>
                                    <input type="text" name="occupation" id="occupation" required>
                                </div>
                                
                                <div>
                                    <label for="adj1">Adjective</label>
                                    <input type="text" name="adj1" id="adj1" required>
                                </div>
                                
                                <div>
                                    <label for="verb1">Verb</label>
                                    <input type="text" name="verb1" id="verb1" required>
                                </div>
                                <button type="submit">Next</button>
                            </form>
                    </article> 
                
            </section>
        </section>


        <section class="computer2">
            <section class="paper">
                <header>
                    <h1>Job Application</h1>
                </header>
                    <section class="timeline">
                        <div class="line"></div>
                        <div class='myinfo2'>
                            <div class="last-dot"></div>
                            <p>My Information</p>
                        </div>
                        <div class="addinfo2">
                            <div class="first-dot"></div>
                            <p>Additional Info</p>
                        </div>
                    </section>
                
                    <article class="form">
                        <h2>Additional Information</h2>
                    
                            <form id="secondForm">
                                <div>
                                    <label for="pnoun">Plural Noun</label>
                                    <input type="text" name="pnoun" id="pnoun" required>
                                </div>
            
                                <div>
                                    <label for="num">Number</label>
                                    <input type="text" name="num" id="num" required>
                                </div>
            
                                <div>
                                    <label for="utime">Unit of Time (e.g., year, day, hour, millisecond, etc)</label>
                                    <input type="text" name="utime" id="utime" required>
                                </div>
            
                                <div>
                                    <label for="adj2">Adjective</label>
                                    <input type="text" name="adj2" id="adj2" required>
                                </div>
            
                                <div>
                                    <label for="verb2">Verb</label>
                                    <input type="text" name="verb2" id="verb2" required>
                                </div>
            
                                <button type="submit">Submit</button>
                            </form>
                    </article> 
                
            </section>

        </section>
        
        <section class="overlay"> 
        </section>
    </main>
</body>
</html>
