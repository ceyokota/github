<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V1 Game On Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Capriola&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <section id="container">

        <h1>Player 1's Turn</h1>

        <div class="bg-splash"></div>

        <section class="top-buttons">
            <button class="rules">Rules</button>
            <button class="quit">Quit</button>
        </section>

        <section class="rolling">
            <section class="dice">
                <img src="images/6_dice.png">
                <img src="images/6_dice.png">
            </section>
            <section>
                <button class="roll">Roll</button>
                <button class="pass">Pass</button>
            </section>
        </section>


        <img src="images/mofubear.png" class="bear">
        <section class="bear-points">
            <p class="points-tag">points</p>
            <p class="points">12</p>
        </section>

        <img src="images/mofubunny.png" class="bunny">
        <section class="bunny-points">
            <p class="points-tag">points</p>
            <p class="points">12</p>
        </section>

    </section>
    
</body>
</html>
